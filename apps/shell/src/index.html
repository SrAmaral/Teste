<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Safra Invest Lab</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#0b0e13" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
</head>
<body>
  <app-root>
    <!-- Substituído quando o Angular inicia; evita tela vazia enquanto a federação carrega os remotes. -->
    <div style="position:fixed;inset:0;display:grid;place-items:center;background:#0b0e13;color:#8b97a8;font:500 13px Inter,system-ui,sans-serif">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
        <div style="width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#d6b25e,#8a6b25);animation:pulsar 1.2s ease-in-out infinite"></div>
        Carregando Safra Invest Lab…
      </div>
      <style>@keyframes pulsar{50%{opacity:.45;transform:scale(.92)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
    </div>
  </app-root>
</body>
</html>
